name: Publicar Inglês em Blocos no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do site
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
